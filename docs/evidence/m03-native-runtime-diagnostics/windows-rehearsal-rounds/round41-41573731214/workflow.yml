# DIAGNOSTIC SCRATCH BRANCH ONLY - never merge. Round 41: dxdiag /x under the owned
# launcher's argument quoting, on hosted Windows PowerShell 5.1. No acceptance.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dxdiag-args:
    name: dxdiag argument quoting (Windows PowerShell 5.1)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: dxdiag probes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File diag/dx/dxdiag_args.ps1 -Out "$env:RUNNER_TEMP\dx"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diag41-dxdiag-args
          path: ${{ runner.temp }}/dx
          retention-days: 7
