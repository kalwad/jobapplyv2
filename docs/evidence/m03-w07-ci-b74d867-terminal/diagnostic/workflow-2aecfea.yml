# DIAGNOSTIC SCRATCH BRANCH ONLY — never merge. Does the exact b74d867 packaged
# Windows service exit at startup because its environment block is empty?
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: service environment probe
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact b74d867 Windows package artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41124431600 -R kalwad/jobapplyv2 -n native-development-windows-2025-af74040c1371eab07d9671f2464d909a60ad626d -D "$env:RUNNER_TEMP\art"
          Expand-Archive "$env:RUNNER_TEMP\art\packages\windows-portable.zip" "$env:RUNNER_TEMP\portable"
          Get-FileHash "$env:RUNNER_TEMP\portable\runtime\japp-orchestrator\japp-orchestrator.exe" -Algorithm SHA256 | Format-List
      - name: Probe empty versus SystemRoot-only environments
        shell: pwsh
        run: python scripts\diag\env_probe.py "$env:RUNNER_TEMP\portable\runtime\japp-orchestrator\japp-orchestrator.exe"
