# Python workspace root (docs/MASTER_IMPLEMENTATION_SPEC.md §5.1, §5.2).
# Managed with uv; not an installable package itself.

[project]
name = "japp-monorepo"
version = "0.0.0"
description = "Python workspace root for the local-first job application platform (spec JAPP-MASTER-001)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Workspace members installed by `uv sync` (editable).
    "orchestrator",
]

[tool.uv]
package = false
# Exact uv pin (M00-W03): any other uv version refuses to operate on this
# project. Bump deliberately together with uv.lock.
required-version = "==0.11.32"

[tool.uv.sources]
orchestrator = { workspace = true }

[tool.uv.workspace]
# services/job-index-api and services/job-ingestion-worker join the workspace
# when their milestones begin (M32+, spec v1.2); they are directories with READMEs until then.
members = ["services/orchestrator"]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    # PyYAML is required by scripts/check_portability.py and
    # scripts/tests/test_ci_workflow.py to parse and validate GitHub Actions
    # workflows.
    "pyyaml==6.0.3",
    "ruff==0.16.0",
    "types-pyyaml==6.0.12.20260724",
]

[tool.pytest.ini_options]
testpaths = ["services/orchestrator/tests", "scripts/tests"]
# --strict-markers: unknown markers are errors, not silent no-ops.
# --strict-config: unknown/typo'd ini options are errors.
# -ra: always summarize non-passing outcomes.
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
# Warnings are errors: accidental deprecations and misconfigurations surface
# immediately instead of scrolling by (M00-W03). Relaxations, if ever needed,
# must be listed here explicitly with a reason.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
src = ["services/orchestrator/src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Strict-but-maintainable curated baseline (M00-W03). Families are selected
# explicitly rather than "ALL" so each addition is a deliberate decision;
# pydocstyle (D) and a few app-stage families are deferred until real
# service code exists (M03+).
select = [
    "A",   # builtin shadowing
    "ANN", # required type annotations
    "ARG", # unused arguments
    "B",   # bugbear
    "C4",  # comprehension correctness
    "DTZ", # naive-datetime bans
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "ICN", # import naming conventions
    "ISC", # implicit string concatenation
    "N",   # pep8 naming
    "PIE", # misc correctness
    "PL",  # pylint rules
    "PT",  # pytest style
    "PTH", # pathlib over os.path
    "RET", # return correctness
    "RUF", # ruff-specific rules
    "S",   # bandit security rules
    "SIM", # simplification
    "T20", # no stray print/pprint
    "TID", # tidy imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    # ISC001 conflicts with the ruff formatter (ruff's own guidance is to
    # disable it when the formatter is in use).
    "ISC001",
]
# The status validator parses the canonical specification, whose headings and
# milestone ranges legitimately use em/en dashes ("## M00 — …", "M18–M23");
# regexes must match those exact characters (RUF001).
allowed-confusables = ["–", "—"]

[tool.ruff.lint.per-file-ignores]
# Pytest tests use bare `assert` by design; S101 would ban it.
"services/**/tests/**" = ["S101"]
# The verification runner is a CLI (T201: printing is its job) that executes
# argv-only commands from the tracked registry with no shell (S404/S603) and
# tool names resolved from PATH by design (S607).
"scripts/verify.py" = ["T201", "S404", "S603", "S607"]
# The status validator is a CLI as well (T201: printing violations is its job).
"scripts/validate_status.py" = ["T201"]
# The traceability validator/generator is a CLI (T201). Its three validation
# coordinators intentionally apply many independent fail-closed rules to one
# record type; splitting them would obscure shared invariants without reducing
# complexity (PLR0912/13/15/17).
"scripts/traceability.py" = ["T201", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]
# The environment doctor is a CLI (T201) that interrogates tools via
# subprocess with no shell (S404/S603) and resolves them from PATH by
# design — diagnosing PATH problems is its purpose (S607). S105 is a
# false positive: STATUS_PASS/"PASS" is verification-status vocabulary
# (suite states), not a credential.
"scripts/doctor.py" = ["T201", "S404", "S603", "S607", "S105"]
# The portability policy checker is a CLI (T201) that runs git via
# subprocess with no shell (S404/S603/S607). S108 is a false positive on
# its banned-token rule tables: the "/tmp" literal is the vocabulary the
# checker REJECTS elsewhere, never a path it uses. Its rule coordinators
# intentionally apply many independent fail-closed checks (PLR0912/
# PLR0915 splits would obscure shared invariants without reducing
# complexity).
"scripts/check_portability.py" = [
    "T201",
    "S404",
    "S603",
    "S607",
    "S108",
    "PLR0912",
    "PLR0915",
]
# Runner tests: pytest asserts (S101), subprocess fixtures (S404/S603/S607),
# and literal exit codes/counts in assertions (PLR2004).
"scripts/tests/**" = ["S101", "S404", "S603", "S607", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "possibly-undefined"]
pretty = true
files = [
    "services",
    "scripts/verify.py",
    "scripts/validate_status.py",
    "scripts/traceability.py",
    "scripts/doctor.py",
    "scripts/check_portability.py",
    "scripts/portability.py",
    "scripts/tests",
]
mypy_path = ["services/orchestrator/src", "scripts", "scripts/tests"]
explicit_package_bases = true
