# Python workspace root (docs/MASTER_IMPLEMENTATION_SPEC.md §5.1, §5.2).
# Managed with uv; not an installable package itself.

[project]
name = "japp-monorepo"
version = "0.0.0"
description = "Python workspace root for the local-first job application platform (spec JAPP-MASTER-001)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Workspace members installed by `uv sync` (editable).
    "orchestrator",
]

[tool.uv]
package = false

[tool.uv.sources]
orchestrator = { workspace = true }

[tool.uv.workspace]
# services/job-index-api and services/job-ingestion-worker join the workspace
# when their milestones begin (M31+); they are directories with READMEs until then.
members = ["services/orchestrator"]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["services/orchestrator/tests"]

[tool.ruff]
target-version = "py312"
src = ["services/orchestrator/src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services"]
mypy_path = ["services/orchestrator/src"]
explicit_package_bases = true
