[package]
name = "japp-desktop"
version = "0.0.1"
description = "Local-first desktop shell"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "japp_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[dependencies]
arc-swap = "=1.9.3"
tauri = { version = "=2.12.4", features = [] }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
serde_json = "=1.0.150"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
