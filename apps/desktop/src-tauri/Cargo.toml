[package]
name = "japp-desktop"
version = "0.0.1"
description = "Local-first desktop shell"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "japp_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[dependencies]
bytes = "=1.12.1"
hmac = "=0.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
jsonschema = { version = "=0.59.0", default-features = false }
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.53.3", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
url = "=2.5.8"
arc-swap = "=1.9.3"
tauri = { version = "=2.12.4", features = [] }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1", "server"] }
tauri = { version = "=2.12.4", features = ["test"] }
tauri-utils = "=2.10.2"
serde_json = "=1.0.150"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
