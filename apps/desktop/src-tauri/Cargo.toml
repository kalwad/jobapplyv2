[package]
name = "japp-desktop"
version = "0.0.1"
description = "Local-first desktop shell"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "japp_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }

[dev-dependencies]
serde_json = "=1.0.150"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
