# DIAGNOSTIC SCRATCH BRANCH ONLY — never merge. Identifies Windows Job members
# that outlive a Rust/MSVC build (KI-0137 root-cause experiment).
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hello:
    name: hello (${{ matrix.variant }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [default, strip, lld, stop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version
          Get-ChildItem (Join-Path (rustc --print sysroot) 'lib\rustlib\x86_64-pc-windows-msvc\bin') | Select-Object Name
      - name: Build hello inside a Job and observe members
        shell: pwsh
        run: |
          cargo new --bin "$env:RUNNER_TEMP\hello" --vcs none
          Set-Location "$env:RUNNER_TEMP\hello"
          $poll = '60'; $stop = 'no'
          switch ('${{ matrix.variant }}') {
            'default' { $poll = '720' }
            'strip' { $env:CARGO_PROFILE_DEV_STRIP = 'debuginfo' }
            'lld' { $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = 'rust-lld.exe' }
            'stop' { $stop = 'stop'; $poll = '120' }
          }
          python "$env:GITHUB_WORKSPACE\scripts\diag\job_linger_diag.py" '${{ matrix.variant }}' $poll $stop -- cargo build -v
  desktop:
    name: desktop (${{ matrix.variant }})
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [cargo, tauri]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustc --version
      - run: pnpm install --frozen-lockfile
      - name: Build desktop inside a Job and observe members
        shell: pwsh
        run: |
          if ('${{ matrix.variant }}' -eq 'cargo') {
            pnpm --filter @japp/desktop build
            python scripts\diag\job_linger_diag.py desktop-cargo 300 no -- cargo build --locked --manifest-path apps\desktop\src-tauri\Cargo.toml
          } else {
            python scripts\diag\job_linger_diag.py desktop-tauri 300 no -- pnpm --filter @japp/desktop exec tauri build --debug --config packaging\windows-local.config.json --ci -- --locked
          }
