# DIAGNOSTIC SCRATCH BRANCH ONLY - never merge. Builds the a5ec1e3 Windows
# development package with one instrumentation commit (JAPP_DIAG eprintln at each
# service error construction site) and launches the packaged desktop GUI with its
# stderr captured, to find why the desktop reports "Local service failed" on a
# hosted Windows runner while the service alone answers READY.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_package_development:
    name: native development package (${{ matrix.os }})
    # These build-host labels do not certify Windows11 or default GNOME GUI.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    steps:
      - name: Check out exact source for read-only package projection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Activate project Node pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Activate pinned pnpm via Corepack (native package)
        run: corepack enable pnpm
      - name: Install exact project uv pin (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          UV_PIN="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["uv"]["required-version"].removeprefix("=="))')"
          pipx install "uv==${UV_PIN}"
          uv --version
      - name: Install exact project uv pin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $uvPin = python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['tool']['uv']['required-version'].removeprefix('=='))"
          pipx install "uv==$uvPin"
          uv --version
      - name: Activate exact project Python pin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pythonPin = (Get-Content -LiteralPath '.python-version' -Raw).Trim()
          uv python install $pythonPin
          $python = (uv python find $pythonPin).Trim()
          "PACKAGE_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install pinned Rust toolchain for native package (rust-toolchain.toml)
        if: runner.os != 'Windows'
        # runner.temp is available at step scope (not jobs.<job_id>.env).
        # Persist this fresh per-job home for every later cargo/rustup probe.
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
        shell: bash
        run: |
          test ! -e "$RUSTUP_HOME"
          mkdir -p "$RUSTUP_HOME"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          RUST_PIN="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])')"
          rustup toolchain install "${RUST_PIN}" --profile minimal --component rustfmt --component clippy

          ACTIVE_TOOLCHAIN="$(rustup show active-toolchain)"
          printf '%s\n' "$ACTIVE_TOOLCHAIN"
          [[ "$ACTIVE_TOOLCHAIN" == "${RUST_PIN}-"* ]]
          [[ "$ACTIVE_TOOLCHAIN" == *"rust-toolchain.toml"* ]]

          CARGO_PROXY="$(command -v cargo)"
          RUSTC_PROXY="$(command -v rustc)"
          CARGO_TOOLCHAIN_BIN="$(rustup which cargo)"
          RUSTC_TOOLCHAIN_BIN="$(rustup which rustc)"
          printf '%s\n' "$CARGO_PROXY" "$RUSTC_PROXY"
          printf '%s\n' "$CARGO_TOOLCHAIN_BIN" "$RUSTC_TOOLCHAIN_BIN"
          test "$CARGO_PROXY" != "$CARGO_TOOLCHAIN_BIN"
          test "$RUSTC_PROXY" != "$RUSTC_TOOLCHAIN_BIN"

          CARGO_VERSION="$(cargo --version)"
          RUSTC_VERSION="$(rustc --version)"
          RUSTFMT_VERSION="$(rustfmt --version)"
          CLIPPY_VERSION="$(cargo clippy --version)"
          printf '%s\n' "$CARGO_VERSION" "$RUSTC_VERSION"
          printf '%s\n' "$RUSTFMT_VERSION" "$CLIPPY_VERSION"
          [[ "$CARGO_VERSION" == "cargo ${RUST_PIN} "* ]]
          [[ "$RUSTC_VERSION" == "rustc ${RUST_PIN} "* ]]

          # Only rustup proxies accept +toolchain; these prove the PATH
          # cargo/rustc commands are the trusted runner proxies.
          cargo "+${RUST_PIN}" --version
          rustc "+${RUST_PIN}" --version

      - name: Install pinned Rust toolchain for native package (rust-toolchain.toml, Windows)
        if: runner.os == 'Windows'
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path -LiteralPath $env:RUSTUP_HOME) { throw "RUSTUP_HOME already exists: $env:RUSTUP_HOME" }
          New-Item -ItemType Directory -Path $env:RUSTUP_HOME | Out-Null
          "RUSTUP_HOME=$env:RUSTUP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $rustPin = python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text(encoding='utf-8'))['toolchain']['channel'])"
          rustup toolchain install $rustPin --profile minimal --component rustfmt --component clippy

          $activeToolchain = (rustup show active-toolchain) -join "`n"
          Write-Output $activeToolchain
          if ($activeToolchain -notlike "$rustPin-*") { throw "active toolchain '$activeToolchain' does not start with the pin $rustPin" }
          if ($activeToolchain -notlike "*rust-toolchain.toml*") { throw "active toolchain is not selected by the rust-toolchain.toml override" }

          $cargoProxy = (Get-Command cargo).Path
          $rustcProxy = (Get-Command rustc).Path
          $cargoToolchainBin = rustup which cargo
          $rustcToolchainBin = rustup which rustc
          Write-Output $cargoProxy $rustcProxy $cargoToolchainBin $rustcToolchainBin
          if ($cargoProxy -eq $cargoToolchainBin) { throw "cargo on PATH is the toolchain binary, not the trusted rustup proxy" }
          if ($rustcProxy -eq $rustcToolchainBin) { throw "rustc on PATH is the toolchain binary, not the trusted rustup proxy" }

          $cargoVersion = cargo --version
          $rustcVersion = rustc --version
          $rustfmtVersion = rustfmt --version
          $clippyVersion = cargo clippy --version
          Write-Output $cargoVersion $rustcVersion $rustfmtVersion $clippyVersion
          if ($cargoVersion -notlike "cargo $rustPin *") { throw "cargo version '$cargoVersion' does not match the pin $rustPin" }
          if ($rustcVersion -notlike "rustc $rustPin *") { throw "rustc version '$rustcVersion' does not match the pin $rustPin" }

          # Only rustup proxies accept +toolchain; these prove the PATH
          # cargo/rustc commands are the trusted runner proxies.
          cargo "+$rustPin" --version
          rustc "+$rustPin" --version

      - name: Install existing CI Linux build prerequisites and retain actual versions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/japp-development-package-sdk"
          sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/japp-development-package-sdk/apt-update.stdout"
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev 2>&1 | tee "$RUNNER_TEMP/japp-development-package-sdk/apt-install.stdout"
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' > "$RUNNER_TEMP/japp-development-package-sdk/dpkg-versions.stdout"
          pkg-config --modversion webkit2gtk-4.1 gtk+-3.0 > "$RUNNER_TEMP/japp-development-package-sdk/webkit-gtk-versions.stdout"
          # Actual SDK provenance; this is not a hash-locked apt/image closure.
      - name: Build isolated development package and run one owned native service actor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PACKAGE_PYTHON -I -S scripts/native_package_ci.py --source (Get-Location).Path --work (Join-Path $env:RUNNER_TEMP 'japp-development-package-work') --proof (Join-Path $env:RUNNER_TEMP 'japp-development-package-proof') --python $env:PACKAGE_PYTHON
      - name: Launch the instrumented packaged desktop with stderr captured
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'gui-diag'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Filter desktop.exe -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.DirectoryName 'runtime\japp-orchestrator\japp-orchestrator.exe') } | Select-Object -First 1
          $zip = Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Filter windows-portable.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          "desktop candidates: $($exe.FullName) zip: $($zip.FullName)" | Tee-Object -FilePath (Join-Path $out 'locate.txt')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $roots = @('C:\japp-gui-diag', (Join-Path $env:LOCALAPPDATA ('JobApply ' + [char]0x03A9 + ' space diag')))
          foreach ($root in $roots) {
            if ($zip) { [IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, $root) } else { Copy-Item -Recurse -LiteralPath $exe.DirectoryName -Destination $root }
            $name = Split-Path -Leaf $root
            $stderr = Join-Path $out ($name + '.stderr'); $stdout = Join-Path $out ($name + '.stdout')
            $process = Start-Process -FilePath (Join-Path $root 'desktop.exe') -WorkingDirectory $root -RedirectStandardError $stderr -RedirectStandardOutput $stdout -PassThru
            $titles = @()
            foreach ($i in 1..120) {
              Start-Sleep -Milliseconds 250
              try { $w = [Windows.Automation.AutomationElement]::RootElement.FindFirst([Windows.Automation.TreeScope]::Children, (New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id))); if ($w) { $t = $w.Current.Name; if ($titles[-1] -cne $t) { $titles += $t } } } catch {}
            }
            "titles for ${root}: $($titles -join ' -> ')" | Tee-Object -FilePath (Join-Path $out ($name + '.titles.txt'))
            Get-Process -Name desktop,japp-orchestrator -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            "---- stderr $root"; Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
          }
      - name: Retain GUI diagnostic output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-gui-service
          path: ${{ runner.temp }}/gui-diag
          retention-days: 7
