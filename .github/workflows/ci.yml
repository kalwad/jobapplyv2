# DIAGNOSTIC SCRATCH BRANCH ONLY — never merge. Round 4: compile the committed
# Windows 11 guest driver (windows11_owned.cs at the campaign head) with Windows
# PowerShell 5.1 on a hosted Windows runner and exercise the reviewed a5ec1e3
# portable package the way the guest would, to measure the audit's Windows guest
# findings (TEMP image identity, Ready, 401 body, SetFocus timing, File menu popup,
# File->Quit, Ctrl+Q with WebView2 focus, refused-connect timing).
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  win-guest:
    name: windows guest driver probe
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the exact a5ec1e3 Windows 11 candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41154871189 -R kalwad/jobapplyv2 -n unreviewed-windows11-inputs-a5ec1e3a894fc6f11354f5adce1631b1cc262470-41154871189 -D "$env:RUNNER_TEMP\cand"
      - name: Probe with Windows PowerShell 5.1
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'cand\retained\inputs\original-native-artifact\packages\windows-portable.zip'
          (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File diag\win_guest_probe.ps1 -Zip $zip -Cs diag\win_owned_head.cs -Out (Join-Path $env:RUNNER_TEMP 'out')
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'out\probe.json') -Raw
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diag4-win-guest
          path: ${{ runner.temp }}/out
          retention-days: 7
