# DIAGNOSTIC SCRATCH BRANCH ONLY — never merge. Round 7 (the guest driver's own lifecycle phases against the fixed package): compile the committed
# Windows 11 guest driver (windows11_owned.cs at the campaign head) with Windows
# PowerShell 5.1 on a hosted Windows runner and exercise the reviewed a5ec1e3
# portable package the way the guest would, to measure the audit's Windows guest
# findings (TEMP image identity, Ready, 401 body, SetFocus timing, File menu popup,
# File->Quit, Ctrl+Q with WebView2 focus, refused-connect timing).
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  win-guest:
    name: windows guest driver probe
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the fixed development portable package (diag/win-gui-service run 41227766396)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41227766396 -R kalwad/jobapplyv2 -n diag-fixed-portable -D "$env:RUNNER_TEMP\fixed"
      - name: Run the guest driver's own lifecycle phases with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File diag\win_guest_probe7.ps1 -Guest diag\win_guest_current.ps1 -Cs diag\win_owned_current.cs -Package (Join-Path $env:RUNNER_TEMP 'fixed') -Out (Join-Path $env:RUNNER_TEMP 'out')
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'out\probe.json') -Raw
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diag7-win-guest
          path: ${{ runner.temp }}/out
          retention-days: 7
