# DIAGNOSTIC SCRATCH BRANCH ONLY — never merge. Round 10 (UI Automation view of the open Win32 File popup, by name): compile the committed
# Windows 11 guest driver (windows11_owned.cs at the campaign head) with Windows
# PowerShell 5.1 on a hosted Windows runner and exercise the reviewed a5ec1e3
# portable package the way the guest would, to measure the audit's Windows guest
# findings (TEMP image identity, Ready, 401 body, SetFocus timing, File menu popup,
# File->Quit, Ctrl+Q with WebView2 focus, refused-connect timing).
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  win-guest:
    name: windows guest driver probe
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the fixed development portable package (diag/win-gui-service run 41227766396)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41227766396 -R kalwad/jobapplyv2 -n diag-fixed-portable -D "$env:RUNNER_TEMP\fixed"
      - name: Explore the open Win32 File popup with UI Automation
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File diag\win_menu_probe9.ps1 -Package (Join-Path $env:RUNNER_TEMP 'fixed') -Out (Join-Path $env:RUNNER_TEMP 'out')
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'out\probe.json') -Raw
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diag10-win-menu
          path: ${{ runner.temp }}/out
          retention-days: 7
