# DIAGNOSTIC SCRATCH BRANCH ONLY — never merge. Round 3: run the proposed
# harness fixes themselves on hosted runners — Windows 11 qemu_argv with a COM1
# firmware console and COM2 protocol port plus the firmware-triggered single
# boot key; GNOME with needrestart suspended, logind session resolution, the
# graphical-session.target timeline and AT-SPI get_action_name.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  win11-boot:
    name: win11 firmware and boot key
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Runner facts
        run: |
          echo "ImageVersion=$ImageVersion"; id; nproc; free -g; df -h / /mnt
          ls -l /dev/kvm || echo "NO /dev/kvm"; getfacl /dev/kvm 2>/dev/null || true
          grep -m1 'model name' /proc/cpuinfo; grep -c -E 'svm|vmx' /proc/cpuinfo
      - name: Download the exact a5ec1e3 Windows 11 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41154871189 -R kalwad/jobapplyv2 -n unreviewed-windows11-inputs-a5ec1e3a894fc6f11354f5adce1631b1cc262470-41154871189 -D "$RUNNER_TEMP/cand"
      - name: Local-only install of the reviewed host tools
        run: |
          D="$RUNNER_TEMP/cand/retained/inputs/host-debs"; E=$(mktemp -d); L=$(mktemp -d); mkdir -p "$L/partial"
          sudo -n /usr/bin/apt-get -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts="$E" -o Dir::State::Lists="$L" -o Dir::Cache::pkgcache= -o Dir::Cache::srcpkgcache= --no-install-recommends -y install "$D"/*.deb > "$RUNNER_TEMP/apt.txt" 2>&1 || { tail -40 "$RUNNER_TEMP/apt.txt"; exit 1; }
          tail -3 "$RUNNER_TEMP/apt.txt"
          sudo -n setfacl -m "u:$(id -u):rw" /dev/kvm; ls -l /dev/kvm
          python3 -c "import fcntl;f=open('/dev/kvm','r+b',buffering=0);print('KVM API',fcntl.ioctl(f.fileno(),0xAE00,0))"
      - name: Download the pinned Evaluation ISO
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          url=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/cand/retained/inputs/media-lock.json'))['media']['url'])")
          want=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/cand/retained/inputs/media-lock.json'))['media']['sha256'])")
          curl -fsSL --proto '=https' --max-time 1500 -o "$RUNNER_TEMP/diag/win11.iso" "$url"
          got=$(sha256sum "$RUNNER_TEMP/diag/win11.iso" | cut -d' ' -f1); echo "sha256 $got"; test "$got" = "$want"
      - name: Boot with the proposed harness argv and firmware-triggered key
        run: |
          sudo -n setfacl -m "u:$(id -u):rw" /dev/kvm; getfacl /dev/kvm
          timeout 700 python3 -I diag/win11_boot3.py diag/repo-root "$RUNNER_TEMP/diag/w3" "$RUNNER_TEMP/out/boot3" "$RUNNER_TEMP/diag/win11.iso" 480
      - name: ACL after one VM lifetime
        if: always()
        run: getfacl /dev/kvm
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diag3-win11-boot
          path: ${{ runner.temp }}/out
          retention-days: 7
  gnome-session:
    name: gnome session (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Runner facts
        run: |
          echo "ImageVersion=$ImageVersion"; id; nproc; free -g; df -h / /mnt
          ls -l /dev/kvm || echo "NO /dev/kvm"
      - name: Download the exact a5ec1e3 GNOME candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41154763996 -R kalwad/jobapplyv2 -n unreviewed-gnome-inputs-a5ec1e3a894fc6f11354f5adce1631b1cc262470-41154763996 -D "$RUNNER_TEMP/cand"
      - name: Local-only install of the reviewed host tools
        run: |
          D="$RUNNER_TEMP/cand/inputs/host-debs"; E=$(mktemp -d); L=$(mktemp -d); mkdir -p "$L/partial"
          sudo -n /usr/bin/apt-get -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts="$E" -o Dir::State::Lists="$L" -o Dir::Cache::pkgcache= -o Dir::Cache::srcpkgcache= --no-install-recommends -y install "$D"/*.deb > "$RUNNER_TEMP/apt.txt" 2>&1 || { tail -40 "$RUNNER_TEMP/apt.txt"; exit 1; }
          tail -3 "$RUNNER_TEMP/apt.txt"
          sudo -n setfacl -m "u:$(id -u):rw" /dev/kvm; ls -l /dev/kvm
      - name: Download the pinned cloud image
        run: |
          curl -fsSL --proto '=https' --max-time 900 -o "$RUNNER_TEMP/cloud.img" https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-amd64.img
          echo "04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94  $RUNNER_TEMP/cloud.img" | sha256sum -c
      - name: Session probe
        run: timeout 2100 python3 -I diag/gnome_host_probe.py "$RUNNER_TEMP/cand/inputs" "$RUNNER_TEMP/cloud.img" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out" kvm 1200 diag/repo-root "${{ matrix.variant }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diag3-gnome-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
          retention-days: 7
