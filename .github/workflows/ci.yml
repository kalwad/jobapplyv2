# Deterministic CI (M00-W06 macOS/Ubuntu; M00-W09 Windows portability
# baseline; spec §M00, §8.5, REQ-PLAT-013, REQ-PLAT-025).
#
# All three required jobs run the exact same two canonical commands a
# developer runs locally — `pnpm run doctor` then `pnpm verify` — after
# activating the repository-pinned toolchain with frozen/locked installs.
# There is no CI-only verification logic and no weaker per-OS subset: the
# doctor and the aggregate runner are the single sources of truth
# (scripts/doctor.py, scripts/verify.py, scripts/verification-suites.json).
#
# Shell policy (M00-W09): there is deliberately NO workflow-global bash
# default. Single-command steps declare no shell, so each OS uses its
# native default (`bash -e` on macOS/Ubuntu, PowerShell 7 with appended
# exit-code propagation on Windows) and a failing child fails the step.
# Multi-line steps declare their shell explicitly: `bash` only on steps
# guarded off Windows (GitHub runs it as `bash --noprofile --norc -eo
# pipefail`), and `pwsh` steps start with $ErrorActionPreference='Stop' +
# $PSNativeCommandUseErrorActionPreference=$true so every native-command
# failure stops the step (no masking). No step depends on an interactive
# shell profile.
#
# The windows-2025 job is a repository/toolchain portability baseline
# only. It does not certify packaged Windows 11 desktop support, secure
# storage, native messaging, model runtime, installers, or updates; Gate D
# (CROSS_PLATFORM_CORE) still requires the native packaged evidence owned
# by M03/M04/M05/M17/M27 (docs/PLATFORM_SUPPORT.md).
#
# Security posture: read-only token, no secrets, official actions only,
# every action pinned to an immutable commit SHA (annotated with its
# release tag), no live-site tests, artifacts uploaded only on failure and
# only Playwright's failure-scoped traces from test-results/.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR/branch runs are cancelled; pushes to main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: doctor + verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history (M01-W07). The M00-W11 preservation oracle in
          # scripts/tests/test_v14_migration.py proves that the v1.4 migration
          # commit changed no contract artifact, which it can only do by
          # reading the committed objects at that exact historical commit. The
          # default shallow fetch-depth of 1 makes those objects unreachable,
          # so the oracle could not run here at all. This repository has a
          # short linear history, so the full fetch is cheap; it adds no
          # CI-only verification logic and weakens no assertion.
          fetch-depth: 0

      - name: Activate pinned Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Activate pinned pnpm via Corepack
        run: corepack enable pnpm

      - name: Show activated pnpm version
        run: pnpm --version

      - name: Install pinned uv (PyPI wheel, exact version from pyproject.toml)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          UV_PIN="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["uv"]["required-version"].removeprefix("=="))')"
          pipx install "uv==${UV_PIN}"
          uv --version

      - name: Install pinned uv (PyPI wheel, exact version from pyproject.toml, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $uvPin = python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['tool']['uv']['required-version'].removeprefix('=='))"
          pipx install "uv==$uvPin"
          uv --version

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        if: runner.os != 'Windows'
        # runner.temp is available at step scope (not jobs.<job_id>.env).
        # Persist this fresh per-job home for every later cargo/rustup probe.
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
        shell: bash
        run: |
          test ! -e "$RUSTUP_HOME"
          mkdir -p "$RUSTUP_HOME"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          RUST_PIN="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])')"
          rustup toolchain install "${RUST_PIN}" --profile minimal --component rustfmt --component clippy

          ACTIVE_TOOLCHAIN="$(rustup show active-toolchain)"
          printf '%s\n' "$ACTIVE_TOOLCHAIN"
          [[ "$ACTIVE_TOOLCHAIN" == "${RUST_PIN}-"* ]]
          [[ "$ACTIVE_TOOLCHAIN" == *"rust-toolchain.toml"* ]]

          CARGO_PROXY="$(command -v cargo)"
          RUSTC_PROXY="$(command -v rustc)"
          CARGO_TOOLCHAIN_BIN="$(rustup which cargo)"
          RUSTC_TOOLCHAIN_BIN="$(rustup which rustc)"
          printf '%s\n' "$CARGO_PROXY" "$RUSTC_PROXY"
          printf '%s\n' "$CARGO_TOOLCHAIN_BIN" "$RUSTC_TOOLCHAIN_BIN"
          test "$CARGO_PROXY" != "$CARGO_TOOLCHAIN_BIN"
          test "$RUSTC_PROXY" != "$RUSTC_TOOLCHAIN_BIN"

          CARGO_VERSION="$(cargo --version)"
          RUSTC_VERSION="$(rustc --version)"
          RUSTFMT_VERSION="$(rustfmt --version)"
          CLIPPY_VERSION="$(cargo clippy --version)"
          printf '%s\n' "$CARGO_VERSION" "$RUSTC_VERSION"
          printf '%s\n' "$RUSTFMT_VERSION" "$CLIPPY_VERSION"
          [[ "$CARGO_VERSION" == "cargo ${RUST_PIN} "* ]]
          [[ "$RUSTC_VERSION" == "rustc ${RUST_PIN} "* ]]

          # Only rustup proxies accept +toolchain; these prove the PATH
          # cargo/rustc commands are the trusted runner proxies.
          cargo "+${RUST_PIN}" --version
          rustc "+${RUST_PIN}" --version

      - name: Install pinned Rust toolchain (rust-toolchain.toml, Windows)
        if: runner.os == 'Windows'
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path -LiteralPath $env:RUSTUP_HOME) { throw "RUSTUP_HOME already exists: $env:RUSTUP_HOME" }
          New-Item -ItemType Directory -Path $env:RUSTUP_HOME | Out-Null
          "RUSTUP_HOME=$env:RUSTUP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $rustPin = python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text(encoding='utf-8'))['toolchain']['channel'])"
          rustup toolchain install $rustPin --profile minimal --component rustfmt --component clippy

          $activeToolchain = (rustup show active-toolchain) -join "`n"
          Write-Output $activeToolchain
          if ($activeToolchain -notlike "$rustPin-*") { throw "active toolchain '$activeToolchain' does not start with the pin $rustPin" }
          if ($activeToolchain -notlike "*rust-toolchain.toml*") { throw "active toolchain is not selected by the rust-toolchain.toml override" }

          $cargoProxy = (Get-Command cargo).Path
          $rustcProxy = (Get-Command rustc).Path
          $cargoToolchainBin = rustup which cargo
          $rustcToolchainBin = rustup which rustc
          Write-Output $cargoProxy $rustcProxy $cargoToolchainBin $rustcToolchainBin
          if ($cargoProxy -eq $cargoToolchainBin) { throw "cargo on PATH is the toolchain binary, not the trusted rustup proxy" }
          if ($rustcProxy -eq $rustcToolchainBin) { throw "rustc on PATH is the toolchain binary, not the trusted rustup proxy" }

          $cargoVersion = cargo --version
          $rustcVersion = rustc --version
          $rustfmtVersion = rustfmt --version
          $clippyVersion = cargo clippy --version
          Write-Output $cargoVersion $rustcVersion $rustfmtVersion $clippyVersion
          if ($cargoVersion -notlike "cargo $rustPin *") { throw "cargo version '$cargoVersion' does not match the pin $rustPin" }
          if ($rustcVersion -notlike "rustc $rustPin *") { throw "rustc version '$rustcVersion' does not match the pin $rustPin" }

          # Only rustup proxies accept +toolchain; these prove the PATH
          # cargo/rustc commands are the trusted runner proxies.
          cargo "+$rustPin" --version
          rustc "+$rustPin" --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          "path=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}

      - name: Cache uv downloads and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/Library/Caches/uv
            ~/AppData/Local/uv/cache
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.python-version') }}

      - name: Cache cargo registry and git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'services/native-host/Cargo.lock', 'packages/contracts/test/contract/rust-harness/Cargo.lock') }}

      - name: Cache pinned Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install JS dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright Chromium (Linux, with system deps)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install pinned Playwright Chromium (macOS)
        if: runner.os == 'macOS'
        run: pnpm exec playwright install chromium

      - name: Install pinned Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Sync Python workspace (locked)
        run: uv sync --locked

      - name: Fetch Rust dependencies (locked)
        run: cargo fetch --locked --manifest-path services/native-host/Cargo.toml

      - name: Fetch test-only contract harness dependencies (locked)
        run: cargo fetch --locked --manifest-path packages/contracts/test/contract/rust-harness/Cargo.toml

      - name: Environment doctor (same command as local `pnpm run doctor`)
        # `run` is required: pnpm has an unrelated built-in `pnpm doctor`
        # command that would shadow the repository script's bare form.
        run: pnpm run doctor

      - name: Canonical aggregate verification (same command as local `pnpm verify`)
        run: pnpm verify

      - name: Assert verification left no tracked changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $porcelain = (git status --porcelain) -join "`n"
          if ($porcelain) { Write-Output $porcelain; throw "verification left tracked changes" }

      - name: Upload Playwright failure artifacts (traces/screenshots/videos only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
