# DIAGNOSTIC SCRATCH BRANCH ONLY - never merge. Round 39 (dxdiag probes, console host): rehearse the Windows 11
# campaign with the harness's own seed/QEMU/COM2 protocol, the real CI package and
# the KI-0177/0178/0179 guest correction, across first-logon Default-profile variants.
# No acceptance can come from it.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-check:
    name: guest source parse and compile (Windows PowerShell 5.1)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse target PowerShell and compile declarations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy RemoteSigned -File diag/repo-root/scripts/windows11/windows11_source_check.ps1 -Proof "$env:RUNNER_TEMP\sc\source-check.json"
          Get-Content "$env:RUNNER_TEMP\sc\source-check.json"
  rehearsal:
    name: windows11 rehearsal ${{ matrix.variant }}
    needs: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        variant: [terminal, conhost]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Host tools and KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools xorriso mtools > /dev/null
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          grep -m1 "model name" /proc/cpuinfo
          echo "ImageVersion=$ImageVersion"
      - name: CI package from hosted run 41538198385 (2100780)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-development-windows-2025-fdba3c3d3c52d130681e047359f7103b7225a504
          run-id: 41538198385
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package
      - name: Package manifest pin
        shell: bash
        run: echo "0396ddf437aa100e9e75ffec032ee432165bb8a01958e652690965b62d4299d4  $RUNNER_TEMP/package/manifest.json" | sha256sum -c -
      - name: Pinned ISO
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/win11.iso" 'https://software-static.download.prss.microsoft.com/dbazure/26300.9457.260913-1737.26h2_ge_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso'
          echo "bc3f24086ebadc94489066b5ad78089e2cf5c3491e90e790bb81a2b199c10e38  $RUNNER_TEMP/win11.iso" | sha256sum -c -
      - name: Rehearsal
        shell: bash
        run: python3 -I -B diag/win11_rehearsal.py "$GITHUB_WORKSPACE/diag/repo-root/scripts" "$RUNNER_TEMP/package" "$RUNNER_TEMP/win11.iso" "$RUNNER_TEMP/out" "${{ matrix.variant }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diag39-win11-rehearsal-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/out
            !${{ runner.temp }}/out/private-work
          retention-days: 7
