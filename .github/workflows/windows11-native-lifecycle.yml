name: reviewed native Windows11 package lifecycle
"on":
  pull_request:
    types:
      - synchronize
  workflow_dispatch:
    inputs:
      expected-head:
        description: Exact reviewed shipping and harness commit SHA
        required: true
        type: string
      inputs-run-id:
        description: Same-repository run containing reviewed input bundle
        required: true
        type: string
      inputs-artifact-id:
        description: Exact same-repository reviewed input artifact ID
        required: true
        type: string
      bundle-manifest-sha256:
        description: Independently reviewed complete bundle manifest SHA256
        required: true
        type: string
      package-manifest-sha256:
        description: Exact original curated Windows package manifest SHA256
        required: true
        type: string
      media-lock-sha256:
        description: Reviewed official publisher and actual ISO digest lock SHA256
        required: true
        type: string
      host-tools-lock-sha256:
        description: Reviewed host tool and exact binary lock SHA256
        required: true
        type: string
      guest-driver-sha256:
        description: Reviewed exact native guest controller source manifest SHA256
        required: true
        type: string
      inputs-run-attempt:
        description: Exact original completed run attempt
        required: true
        type: string
      inputs-artifact-digest-sha256:
        description: Root-reviewed exact artifact ZIP digest SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: win11-vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  authorize:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.base.repo.id == github.event.repository.id && github.event.pull_request.head.ref == 'codex/autofill-evaluation-hardening') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.request.outputs.enabled }}
      mode: ${{ steps.request.outputs.mode }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      package_build_sha: ${{ steps.request.outputs.package_build_sha }}
      source_tree_sha: ${{ steps.request.outputs.source_tree_sha }}
      artifact_run_id: ${{ steps.request.outputs.artifact_run_id }}
      artifact_id: ${{ steps.request.outputs.artifact_id }}
      package_manifest_sha256: ${{ steps.request.outputs.package_manifest_sha256 }}
      request_id: ${{ steps.request.outputs.request_id }}
      bundle_sha256: ${{ steps.request.outputs.bundle_sha256 }}
      media_lock_sha256: ${{ steps.request.outputs.media_lock_sha256 }}
      host_tools_sha256: ${{ steps.request.outputs.host_tools_sha256 }}
      guest_driver_sha256: ${{ steps.request.outputs.guest_driver_sha256 }}
    steps:
      - name: Check out exact control head with complete ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 0
      - name: Read actual executing workflow commit separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-origin
          persist-credentials: false
          fetch-depth: 1
      - name: Bind explicit root request and immutable artifact metadata
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B control/scripts/windows11/windows11_request.py \
            --mode vm \
            --control "$GITHUB_WORKSPACE/control" \
            --workflow-source "$GITHUB_WORKSPACE/workflow-origin" \
            --proof "$RUNNER_TEMP/japp-win11-vm-request"
      - name: Retain metadata gate without package or VM claim
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: win11-vm-request-${{ github.run_id }}
          path: ${{ runner.temp }}/japp-win11-vm-request/
          if-no-files-found: error
          retention-days: 7
  win11:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EXPECTED_HEAD: ${{ needs.authorize.outputs.source_sha }}
      PACKAGE_BUILD_HEAD: ${{ needs.authorize.outputs.package_build_sha }}
      SOURCE_TREE: ${{ needs.authorize.outputs.source_tree_sha }}
      MANIFEST_SHA256: ${{ needs.authorize.outputs.package_manifest_sha256 }}
      PACKAGE_MANIFEST_SHA256: ${{ needs.authorize.outputs.package_manifest_sha256 }}
      BUNDLE_SHA256: ${{ needs.authorize.outputs.bundle_sha256 }}
      MEDIA_LOCK_SHA256: ${{ needs.authorize.outputs.media_lock_sha256 }}
      HOST_TOOLS_SHA256: ${{ needs.authorize.outputs.host_tools_sha256 }}
      GUEST_DRIVER_SHA256: ${{ needs.authorize.outputs.guest_driver_sha256 }}
    steps:
      - name: Check out exact reviewed shipping and harness source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download exact externally reviewed same-repository inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.authorize.outputs.artifact_id }}
          run-id: ${{ needs.authorize.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/japp-reviewed-win11-inputs
          digest-mismatch: error
      - name: Own one bounded actual native Windows11 package campaign
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B scripts/windows11/windows11_vm.py \
            --source "$GITHUB_WORKSPACE" \
            --bundle "$RUNNER_TEMP/japp-reviewed-win11-inputs/inputs" \
            --proof "$RUNNER_TEMP/japp-win11-vm-proof" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --bundle-sha256 "$BUNDLE_SHA256" \
            --media-lock-sha256 "$MEDIA_LOCK_SHA256" \
            --host-tools-sha256 "$HOST_TOOLS_SHA256" \
            --guest-driver-sha256 "$GUEST_DRIVER_SHA256" \
            --expected-head "$EXPECTED_HEAD" \
            --package-build-head "$PACKAGE_BUILD_HEAD" \
            --source-tree "$SOURCE_TREE"
      - name: Retain finite closure, helper and actual campaign evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: win11-lifecycle-${{ needs.authorize.outputs.source_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/japp-win11-vm-proof/retained/
            ${{ runner.temp }}/japp-win11-vm-proof/retention-failure.json
          if-no-files-found: error
          retention-days: 7
    needs: authorize
    if: ${{ needs.authorize.outputs.enabled == 'true' && needs.authorize.outputs.mode == 'ONE_REVIEWED_VM' }}
