[project]
name = "orchestrator"
version = "0.0.1"
description = "Local orchestrator service (Python 3.12 + FastAPI + Pydantic v2 per spec §5.2). The service skeleton arrives in M03-W02; the M00-W02 scaffold contains no service code."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
