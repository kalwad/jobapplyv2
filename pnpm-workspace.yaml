# pnpm workspace layout (docs/MASTER_IMPLEMENTATION_SPEC.md §5.1, §5.2).

# M00-W03 enforcement: refuse to run under a Node/pnpm that does not match
# the engines pins in package.json (use the .nvmrc Node — see README).
engineStrict: true

# Always record exact dependency versions (reproducibility).
savePrefix: ""

packages:
  - "apps/*"
  - "packages/*"

# Single source of exact dependency versions shared by workspace packages
# (reproducible versions; see also pnpm-lock.yaml).
catalog:
  # @types/node tracks the pinned Node 24 LTS runtime (.nvmrc), not the
  # newest Node major (M00-W03).
  "@types/node": 24.13.3
  # Strict JSON Schema Draft 2020-12 validation for packages/contracts
  # (M01-W01); ajv-formats supplies the RFC 3339 date/date-time assertions.
  ajv: 8.20.0
  ajv-formats: 3.0.1
  typescript: 6.0.3
  vitest: 4.1.10

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.7"
  - "@turbo/darwin-arm64@2.10.7"
  - "@turbo/linux-64@2.10.7"
  - "@turbo/linux-arm64@2.10.7"
  - "@turbo/windows-64@2.10.7"
  - "@turbo/windows-arm64@2.10.7"
  - turbo@2.10.7

# esbuild (a vite/vitest dependency of the M02-W03 mock ATS lab) resolves
# its platform binary through optionalDependencies; its postinstall script
# is unnecessary and deliberately NOT executed (fewer lifecycle scripts,
# same deterministic binary). Recording the decision here keeps
# `pnpm install --frozen-lockfile` exit-0 on every certified platform.
allowBuilds:
  esbuild: false
  # spawn-sync (a wxt -> web-ext-run -> fx-runner transitive dependency of
  # the M02-W07 feasibility extension) uses postinstall only to compile a
  # child_process.spawnSync fallback for pre-0.12 Node. The pinned Node 24
  # runtime has native spawnSync, so the lifecycle script is unnecessary and
  # deliberately NOT executed; recording the decision keeps
  # `pnpm install --frozen-lockfile` exit-0 on every certified platform.
  spawn-sync: false
