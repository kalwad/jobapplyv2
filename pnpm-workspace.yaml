# pnpm workspace layout (docs/MASTER_IMPLEMENTATION_SPEC.md §5.1, §5.2).

# M00-W03 enforcement: refuse to run under a Node/pnpm that does not match
# the engines pins in package.json (use the .nvmrc Node — see README).
engineStrict: true

# Always record exact dependency versions (reproducibility).
savePrefix: ""

packages:
  - "apps/*"
  - "packages/*"

# Single source of exact dependency versions shared by workspace packages
# (reproducible versions; see also pnpm-lock.yaml).
catalog:
  # @types/node tracks the pinned Node 24 LTS runtime (.nvmrc), not the
  # newest Node major (M00-W03).
  "@types/node": 24.13.3
  typescript: 6.0.3
  vitest: 4.1.10

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.7"
  - "@turbo/darwin-arm64@2.10.7"
  - "@turbo/linux-64@2.10.7"
  - "@turbo/linux-arm64@2.10.7"
  - "@turbo/windows-64@2.10.7"
  - "@turbo/windows-arm64@2.10.7"
  - turbo@2.10.7
