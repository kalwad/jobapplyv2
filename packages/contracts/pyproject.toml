[project]
name = "japp-contracts"
version = "0.0.1"
description = "Generated strict Python contracts for the local service"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/src/japp_contracts"]
